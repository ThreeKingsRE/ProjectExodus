  <title id="t">Architectural drawing</title>
  <desc id="d">Interior elevation of a room wall with timber panelling to chest height marked, and a round section through the wall showing the panelling, cap rail and baseboard. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
