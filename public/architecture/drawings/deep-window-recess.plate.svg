  <title id="t">Architectural drawing</title>
  <desc id="d">Plan through a thick masonry wall with a window set in its outer face and the opening splayed wider toward the room, with a built-in seat, so that daylight fans out into the room, with a round close-up of the splayed reveal. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
    svg { --_ink: var(--ink, #1f2a37); --_paper: var(--paper, #f4efe3); --_accent: var(--accent, #9a3412); }
