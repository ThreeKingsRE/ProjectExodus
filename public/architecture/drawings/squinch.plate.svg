  <title id="t">Architectural drawing</title>
  <desc id="d">Plan looking up at a square bay where an arched niche spans each corner, turning the square into an octagon that carries a round dome. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
