  <title id="t">Deep Window Recess: plan</title>
  <desc id="d">Plan through a very thick wall where a small window near the outer face opens into a wide recess whose sides flare inward to spread the light, with a seat built into it. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
