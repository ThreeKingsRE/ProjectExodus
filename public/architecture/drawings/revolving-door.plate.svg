  <title id="t">Architectural drawing</title>
  <desc id="d">Plan of an entrance where four glass wings radiate from a central post and turn inside a curved glass enclosure, so the opening is never left open to the outside. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
