  <title id="t">Dome: half section · half elevation</title>
  <desc id="d">Half section and half elevation of a hemispherical dome raised on a windowed drum and crowned by a small lantern, with the meridian ribs shown on the elevation half. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
