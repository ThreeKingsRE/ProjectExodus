  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of an arched castle gateway with a heavy lattice grate partly lowered in grooves cut into the sides of the opening, its spiked foot ready to drop. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
