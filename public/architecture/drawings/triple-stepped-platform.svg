  <title id="t">Triple-Stepped Platform: elevation</title>
  <desc id="d">Elevation of a building set on a stone base of three broad steps, lifting it above the surrounding ground for drainage and ceremony. Source: Stepped podium in the Aksumite and Ethiopian church tradition. Generic original drawing by Project Exodus; not a survey.</desc>
