  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a semicircular stone arch with wedge-shaped voussoirs, a keystone at the crown, imposts and piers, with its single centre of curvature marked. Source: Original geometric construction drawn by Project Exodus from the standard compass method for this arch form; no external drawing reproduced.</desc>
