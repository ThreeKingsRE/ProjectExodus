  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of an equilateral pointed arch, each side struck from the opposite springing point, with voussoirs, imposts and piers. Source: Original geometric construction drawn by Project Exodus from the standard compass method for this arch form; no external drawing reproduced.</desc>
