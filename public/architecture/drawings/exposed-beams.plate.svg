  <title id="t">Architectural drawing</title>
  <desc id="d">One-point perspective down a room with exposed ceiling beams: each timber shows its underside and the face toward you, with floorboards of the room above running across them. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
