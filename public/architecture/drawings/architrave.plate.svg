  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a door with its moulded surround highlighted, and a round close-up of the mitred top corner of the surround where the head meets the side. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
