  <title id="t">Belvedere: elevation</title>
  <desc id="d">Elevation of an open pavilion set high on a solid base reached by steps, placed so that people can look out over the surrounding landscape. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
