  <title id="t">Arbor: elevation</title>
  <desc id="d">Elevation of a small garden shelter made of an arched lattice frame over a bench, meant to be covered with climbing plants. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
