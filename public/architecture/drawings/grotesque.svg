<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Grotesque: elevation</title>
  <desc id="d">Elevation of a carved pilaster panel of Renaissance grotesque ornament: a candelabrum rising from a vase, flanked symmetrically by scrolls, hybrid winged creatures and swags, with a mask at its centre and a bird at the top. Source: After Renaissance grotesque pilasters derived from the painted rooms of the Domus Aurea, Rome. Generic; not a copy. Original drawing by Project Exodus.</desc>
