  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a metal ring hung from a decorative plate on a door, swinging on a pivot so it can be struck against a small plate below. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
