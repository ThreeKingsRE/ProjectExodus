  <title id="t">Inglenook: plan</title>
  <desc id="d">Plan of a deep fireplace recess opening off a room, with fixed benches along each side wall facing the hearth, a small window for light, and a heavy beam spanning the opening overhead. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
