  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a wall with three flat columns (pilasters) set into it, each with a base, shaft and capital, and a round plan section through one pilaster showing how little it projects compared with a full round column drawn dashed. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
