  <title id="t">Architectural drawing</title>
  <desc id="d">Plan section through a wall with two shallow rectangular projections that act as flattened columns, compared with a free-standing round column of the same width. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
    svg { --_ink: var(--ink, #1f2a37); --_paper: var(--paper, #f4efe3); --_accent: var(--accent, #9a3412); }
