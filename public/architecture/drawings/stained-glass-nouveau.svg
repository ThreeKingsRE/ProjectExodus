  <title id="t">Art Nouveau Stained Glass: elevation</title>
  <desc id="d">Elevation of a window in the Art Nouveau style: the lead lines follow sinuous whiplash stems that rise to stylised tulips beneath a radiating sun. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
