  <title id="t">Architectural drawing</title>
  <desc id="d">Plan of a wall between two rooms with a door that slides sideways into a hollow cavity inside the wall, shown both closed (dashed) and fully open in its pocket, with a round close-up of the doorway and the pocket. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
