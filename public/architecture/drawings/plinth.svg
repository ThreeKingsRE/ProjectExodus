<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Plinth: section</title>
  <desc id="d">Section through the foot of a wall where a thicker band of stone projects at the base, its top cut at an angle to shed water, with a damp-proof layer above. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
