<svg xmlns="http://www.w3.org/2000/svg" viewBox="142 102 356 462" role="img" aria-labelledby="t d">
  <title id="t">Architectural drawing</title>
  <desc id="d">Vertical section through a glass building skin of aluminium framing and double-glazed panels, hung from the edge of each floor slab on brackets, with opaque panels hiding the floor zones. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
    svg { --_ink: var(--ink, #1f2a37); --_paper: var(--paper, #f4efe3); --_accent: var(--accent, #9a3412); }
