  <title id="t">Layered Courtyard System: plan</title>
  <desc id="d">Plan of a palace laid out as a chain of walled courtyards along one axis, each entered through a gate from the last and each smaller and more private than the one before. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
