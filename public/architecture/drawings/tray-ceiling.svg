  <title id="t">Tray Ceiling: section</title>
  <desc id="d">Section through a room whose ceiling steps up in the middle like an upturned tray, with a moulding and hidden lighting at the step. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
