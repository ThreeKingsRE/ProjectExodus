<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Art Deco Terrazzo: plan</title>
  <desc id="d">Plan of a 1920s–30s style terrazzo floor: a sunburst fanning out from a corner and a band of chevrons, outlined in brass strips, with chips of marble in the cement. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
