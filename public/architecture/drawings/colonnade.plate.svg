  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a long row of evenly spaced columns, each with a base and capital, carrying a continuous horizontal beam. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
