  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a tall pointed window filled with small irregular pieces of coloured glass held in strips of lead, braced by iron bars, with a round picture panel at its centre. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
    svg { --_ink: var(--ink, #1f2a37); --_paper: var(--paper, #f4efe3); --_accent: var(--accent, #9a3412); }
