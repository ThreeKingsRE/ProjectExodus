  <title id="t">Mosaic Floor: plan</title>
  <desc id="d">Plan of a mosaic floor made of small square stone pieces: a Greek key border, a background laid in a straight grid, and a central medallion with pieces following concentric rings. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
