  <title id="t">Architectural drawing</title>
  <desc id="d">Side elevation of a mosque pulpit: a gateway at the foot opens onto a straight flight of steps between triangular side panels of geometric lattice, rising to a seat sheltered by a small kiosk with a conical canopy. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
