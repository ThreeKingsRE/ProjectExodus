  <title id="t">Parametric Façade: elevation</title>
  <desc id="d">Elevation of a screen of identical panels whose openings vary smoothly in size according to a rule, here distance from an attractor standing for the strongest sun; the graph below is the rule that generated them. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
