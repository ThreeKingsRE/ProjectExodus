  <title id="t">Terrazzo: plan</title>
  <desc id="d">Plan of a terrazzo floor: small chips of marble scattered through a cement base, ground smooth, divided into bays by thin metal strips. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
