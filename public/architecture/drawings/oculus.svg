<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Oculus: section</title>
  <desc id="d">Section through a domed rotunda proportioned like the Pantheon: a coffered hemispherical dome whose sphere would just touch the floor, open at the crown so a shaft of sunlight falls into the room. Source: Dimensions of the Pantheon, Rome (c. 125 CE): rotunda diameter and height 43.3 m, oculus 8.2 m. Original drawing by Project Exodus; coffering and shell simplified.</desc>
