  <title id="t">Architectural drawing</title>
  <desc id="d">Plan of a ramp that spirals upward around an open central light well inside a circular wall, with the direction of rise marked. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
