  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a domed building with a glazed lantern at the crown of the dome, and a round close-up of the lantern: its columns, glazed openings, entablature, small dome and finial, shown against the great dome beneath. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
