  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a doorway framed in late-Gothic branch-work: the jambs are tree trunks with bark, whose branches arch over the opening and interlace at the top, ending in lopped stubs instead of conventional tracery. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
