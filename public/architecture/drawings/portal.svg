<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Portal: elevation · plan close-up in context</title>
  <desc id="d">Elevation of a monumental church entrance, its stepped arches marked, and a round plan section through one side of the doorway showing how the jambs step outward in orders, each with a column shaft set in the corner. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
