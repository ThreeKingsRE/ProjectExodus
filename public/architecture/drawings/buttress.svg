  <title id="t">Buttress: section</title>
  <desc id="d">Section through a wall and the stepped masonry pier built against it, each stage set back with a sloping top, with the outward thrust of a vault carried down through it into the ground. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
