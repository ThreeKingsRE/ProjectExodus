  <title id="t">Pagoda: elevation</title>
  <desc id="d">Elevation of a five-storey Japanese pagoda: diminishing storeys each sheltered by deep upturned eaves on bracket sets, a central pillar running up through the core, and a bronze spire of nine rings topped by a jewel. Source: After Japanese five-storey pagodas such as those at Hōryū-ji and Daigo-ji. Generic; not a survey. Original drawing by Project Exodus.</desc>
