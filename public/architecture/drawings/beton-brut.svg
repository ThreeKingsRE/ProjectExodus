  <title id="t">Béton Brut: elevation · section</title>
  <desc id="d">Elevation of a raw concrete wall showing the marks of its making: board grain from the timber forms, a day joint between lifts, plywood panel joints and a grid of form-tie holes; the section shows the boards, walers and ties that left them. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
