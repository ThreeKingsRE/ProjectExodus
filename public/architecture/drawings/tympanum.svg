  <title id="t">Tympanum: elevation</title>
  <desc id="d">Elevation of a Romanesque portal: the semicircular tympanum above the lintel holds a Christ in Majesty in a mandorla with the four evangelist symbols, framed by carved archivolts and divided below by a central trumeau. Source: After French Romanesque portals such as Moissac (c. 1130). Generic; not a copy. Original drawing by Project Exodus.</desc>
