  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a door with a glazed transom light above it, and a round close-up of the transom bar and its four panes. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
