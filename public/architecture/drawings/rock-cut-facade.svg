  <title id="t">Rock-Cut Façade: elevation</title>
  <desc id="d">Elevation of a two-storey temple front carved directly out of a cliff: a columned portico with a pediment below, and above it a round tholos between broken half-pediments, all cut from the living rock that still surrounds it. Source: After Al-Khazneh (the Treasury), Petra, Jordan (1st c. CE). Simplified; not a survey. Original drawing by Project Exodus.</desc>
