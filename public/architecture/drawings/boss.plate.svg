  <title id="t">Architectural drawing</title>
  <desc id="d">Reflected ceiling plan of a rib-vaulted bay with the carved foliate boss at the crossing of the diagonal ribs, and a section below showing the boss as the keystone that locks the ribs together. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
