<svg xmlns="http://www.w3.org/2000/svg" viewBox="121.2 245.36 459.13 149.64" role="img" aria-labelledby="t d">
  <title id="t">Architectural drawing</title>
  <desc id="d">Section through a gently sloping ramp at no more than 1 in 12, rising at most 760 mm before a level landing, with handrails at a constant height above the surface. Source: Ramp limits from the 2010 ADA Standards for Accessible Design, §405 (max slope 1:12, max rise 760 mm per run, landings ≥ 1525 mm, handrails 865–965 mm). Original drawing by Project Exodus.</desc>
  <style>
    svg { --_ink: var(--ink, #1f2a37); --_paper: var(--paper, #f4efe3); --_accent: var(--accent, #9a3412); }
    .paper { fill: var(--_paper); }
    .ink { stroke: var(--_ink); fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .solid { fill: var(--_ink); stroke: none; }
    .l-profile { stroke-width: 1.5; }
    .l-cut { stroke-width: 2.2; }
    .l-fine { stroke-width: 0.6; }
    .l-hair, .l-shading { stroke-width: 0.35; }
    .l-dims, .l-labels { stroke-width: 0.45; }
    .l-center { stroke-width: 0.5; stroke-dasharray: 14 3 2 3; stroke: var(--_accent); }
    text { fill: var(--_ink); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9px; letter-spacing: 0.08em; stroke: none; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 0.14em; }
    .t-sub { font-size: 9px; opacity: 0.85; }
    .t-small { font-size: 7.5px; opacity: 0.85; }
    .t-accent { fill: var(--_accent); }
    .t-credit { font-size: 7.5px; opacity: 0.75; letter-spacing: 0.04em; }
  </style>
  <defs>
    <pattern id="h-stone" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" class="ink l-hair"/>
    </pattern>
    <pattern id="h-brick" width="16" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0H16M0 4H16M4 0V4M12 4V8" class="ink l-hair"/>
    </pattern>
    <pattern id="h-concrete" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.6" class="solid"/><circle cx="7" cy="7" r="0.5" class="solid"/><path d="M5 1l1.2 1.6h-2.4z" class="ink l-hair"/>
    </pattern>
    <pattern id="h-earth" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12L12 0M-3 3L3 -3M9 15L15 9" class="ink l-hair"/><path d="M0 6L6 0" class="ink l-hair" stroke-dasharray="2 2"/>
    </pattern>
    <pattern id="h-timber" width="40" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3C10 1 20 5 40 3" class="ink l-hair"/>
    </pattern>
    
  </defs>
  <rect class="paper" x="121.2" y="245.36" width="459.13" height="149.64"/>
  <g class="layer-hatch ink l-hair">
    <path d="M139.2 330 L562.33 330 L562.33 340 L139.2 340 Z" fill="url(#h-earth)" stroke="none"/>
    <path d="M180 330 L490.08 304.16 L541.93 304.16 L541.93 330 Z" fill="url(#h-concrete)" stroke="none"/>
  </g>
  <g class="layer-fine ink l-fine">
    <path d="M180 330L180 299.4"/>
    <path d="M335.04 317.08L335.04 286.48"/>
    <path d="M490.08 304.16L490.08 273.56"/>
    <path d="M541.93 304.16L541.93 273.56"/>
    <path d="M128.15 327 L180 327 L180 330 L128.15 330 Z" stroke-dasharray="4 3"/>
  </g>
  <g class="layer-profile ink l-profile">
    <path d="M139.2 330 L562.33 330 L562.33 340 L139.2 340 Z"/>
    <path d="M169.8 299.4 L180 299.4 L490.08 273.56 L541.93 273.56" stroke-width="2.2"/>
  </g>
  <g class="layer-cut ink l-cut">
    <path d="M180 330 L490.08 304.16 L541.93 304.16 L541.93 330 Z"/>
  </g>
  <text class="t-credit" x="127.2" y="375">SOURCE: Ramp limits from the 2010 ADA Standards for Accessible Design, §405 (max slope 1:12, max</text>
  <text class="t-credit" x="127.2" y="384">rise 760 mm per run, landings ≥ 1525 mm, handrails 865–965 mm). Original drawing by Project</text>
  <text class="t-credit" x="127.2" y="393">Exodus.</text>
</svg>
