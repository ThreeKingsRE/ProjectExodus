  <title id="t">Onion Dome: half section · half elevation</title>
  <desc id="d">Half section and half elevation of an onion dome: it swells wider than the drum, then tapers through a reverse curve to a point topped by a cross finial. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
