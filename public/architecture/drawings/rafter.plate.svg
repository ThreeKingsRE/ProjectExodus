  <title id="t">Architectural drawing</title>
  <desc id="d">Section through a pitched roof: pairs of common rafters rise from notched seats on the wall plates to a ridge board, overhang the walls at the eaves, carry battens and tiles, and are tied at their feet by a ceiling joist so they cannot spread the walls. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
