<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Oriel Window: section</title>
  <desc id="d">Section through a wall where a glazed bay juts out from an upper floor, carried on stepped stone brackets, without reaching down to the ground. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
