  <title id="t">Cascade: section</title>
  <desc id="d">Section through a garden water staircase: a series of stone steps over which water spills in thin sheets from ledge to ledge into a pool at the bottom. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
