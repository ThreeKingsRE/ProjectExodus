  <title id="t">Cartouche: elevation</title>
  <desc id="d">Elevation of a Baroque cartouche: an oval field for an inscription or coat of arms, surrounded by a frame whose edges curl and scroll like parchment, topped by a shell and hung with garlands and a pendant drop. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
