  <title id="t">Canal: plan</title>
  <desc id="d">Plan of a long, straight, stone-edged channel of still water running down a garden axis between rows of trees, widening into basins at its ends. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
