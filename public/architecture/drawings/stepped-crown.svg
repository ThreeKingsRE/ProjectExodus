  <title id="t">Stepped Crown: elevation</title>
  <desc id="d">Elevation of the top of a tall tower that steps back in a series of narrowing tiers to a slender spire, staying inside a sloping envelope like those required by early skyscraper zoning. Source: Setback form as encouraged by the New York 1916 Zoning Resolution. Original, generic drawing by Project Exodus; not a specific building.</desc>
