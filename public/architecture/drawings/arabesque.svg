<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Arabesque: elevation</title>
  <desc id="d">Elevation of an arabesque panel: stems scroll out from a central medallion, branching and ending in spirals and split leaves; the quarter-design is mirrored on both axes so the panel can repeat edge to edge without end. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
