  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a door split into an upper and a lower leaf with a shelf where they meet, and a round close-up of the split, the shelf and the two leaves. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
