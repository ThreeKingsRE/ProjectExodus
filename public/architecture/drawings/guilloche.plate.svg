  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a guilloche band: two ribbons weave over and under each other in a continuous wave, enclosing a row of circular eyes, each filled with a small rosette. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
