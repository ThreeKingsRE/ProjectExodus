  <title id="t">Gargoyle: section · close-up in context</title>
  <desc id="d">Section through a parapet gutter and gargoyle: rain runs off the lead roof into the gutter, through a channel inside a stone beast that projects far enough to throw the water clear of the wall, with a round close-up of the carved head. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
