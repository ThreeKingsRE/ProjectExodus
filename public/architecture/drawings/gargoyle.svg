<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Gargoyle: section</title>
  <desc id="d">Section through a parapet gutter and gargoyle: rain runs off the roof into the gutter behind the parapet, then along a channel cut through a carved stone beast that projects far enough to throw the water clear of the wall. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
