  <title id="t">Flying Buttress: section</title>
  <desc id="d">Half cross-section of a Gothic church: the outward push of the high nave vault is carried by arched stone struts leaping over the side aisle to tall outer piers topped with pinnacles. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
