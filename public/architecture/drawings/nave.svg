  <title id="t">Nave: section</title>
  <desc id="d">Cross-section through a basilican church: a tall central nave lit by clerestory windows above lower side aisles under lean-to roofs, the nave walls carried on arcades of piers and the whole covered by a timber truss roof. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
