  <title id="t">Architectural drawing</title>
  <desc id="d">Isometric of a roof frame: the ridgepole runs along the peak, carried by posts at each gable, and the rafters hang in pairs between it and the wall plates, with collar ties stiffening some pairs. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
