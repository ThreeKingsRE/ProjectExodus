  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of an arcade with its spandrels, the roughly triangular wall areas between the curves of neighbouring arches and the course above, here carved with roundels and trailing foliage. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
