  <title id="t">Pediment Door: elevation · close-up in context</title>
  <desc id="d">Elevation of a doorway framed by two pilasters and crowned by an entablature and a triangular pediment, with a round close-up of the crown. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
