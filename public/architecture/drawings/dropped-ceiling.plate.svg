<svg xmlns="http://www.w3.org/2000/svg" viewBox="127 92 411 438" role="img" aria-labelledby="t d">
  <title id="t">Architectural drawing</title>
  <desc id="d">Section through a room with a lightweight ceiling of tiles in a metal grid hung on wires below the concrete slab, leaving a void above for ducts and cables. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
    svg { --_ink: var(--ink, #1f2a37); --_paper: var(--paper, #f4efe3); --_accent: var(--accent, #9a3412); }
