  <title id="t">Architectural drawing</title>
  <desc id="d">Section through a garden cascade: seven stone ledges stepping down 600 mm each, water spilling over each coped lip in a thin curved sheet and rippling where it lands, and a basin at the foot, with a round close-up of one step. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
