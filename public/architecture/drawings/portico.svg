  <title id="t">Portico: elevation</title>
  <desc id="d">Elevation of a hexastyle portico: six Ionic columns on a stepped base carry an entablature and pediment in front of the entrance wall; the key plan shows the porch standing before the main room. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
