    </pattern>
    <pattern id="h-concrete" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.6" class="solid"/><circle cx="7" cy="7" r="0.5" class="solid"/><path d="M5 1l1.2 1.6h-2.4z" class="ink l-hair"/>
