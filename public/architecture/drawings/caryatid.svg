<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Caryatid: elevation</title>
  <desc id="d">Elevation of a caryatid: a standing woman in a peplos carries the entablature on a cushion capital set on her head; the folds fall straight over her weight-bearing leg while the other knee presses forward through the drapery. Source: After the caryatids of the Erechtheion south porch, Athens (c. 421–406 BCE), as recorded in Stuart &amp; Revett, The Antiquities of Athens, vol. 2 (1787; public domain). Simplified; not a tracing.</desc>
