  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a stone cross-window with its horizontal bar marked, and a round vertical section through that transom showing its sloping top that sheds rain, its drip groove underneath, and the glass above and below. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
