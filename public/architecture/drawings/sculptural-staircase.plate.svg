  <title id="t">Architectural drawing</title>
  <desc id="d">Isometric of a stair made as a single folded concrete plate, its treads and risers forming one zig-zag slab of constant thickness, rising past a board-marked concrete wall to a cantilevered landing. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
