    <text class="t-small" x="26" y="736">§405 (max slope 1:12, max rise 760 mm per run, landings ≥ 1525 mm,</text>
    <text class="t-small" x="26" y="746">handrails 865–965 mm). Original drawing by Project Exodus.</text>
