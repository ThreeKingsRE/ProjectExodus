  <title id="t">Accessibility Ramp: section · close-up in context</title>
  <desc id="d">Section through a wheelchair ramp rising 760 mm at a slope of 1 in 12 to a landing at a doorway, with handrails extended 305 mm past each end, and a round close-up of the top landing and handrail end. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
