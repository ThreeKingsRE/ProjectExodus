  <title id="t">Ogee Arch: elevation</title>
  <desc id="d">Elevation of an ogee arch formed by a convex curve rising into a concave curve on each side, meeting in a point, with the four centres marked. Source: Original geometric construction drawn by Project Exodus from the standard compass method for this arch form; no external drawing reproduced.</desc>
