  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a timber house standing on tall posts, its floor lifted clear of floodwater and damp ground, reached by a ladder and covered by a steep thatched roof. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
