  <title id="t">Glass Elevator: section</title>
  <desc id="d">Section through a glass lift on a building face: a glazed car runs on guide rails inside a glazed shaft, hung from hoist ropes over a sheave at the top and balanced by a counterweight, with buffers in the pit. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
