  <title id="t">Horseshoe Arch: elevation</title>
  <desc id="d">Elevation of a horseshoe arch whose curve continues below its centre, so the opening narrows at the springing, with voussoirs and piers. Source: Original geometric construction drawn by Project Exodus from the standard compass method for this arch form; no external drawing reproduced.</desc>
