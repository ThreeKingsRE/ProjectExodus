  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a High-Tech building whose steel columns, beams and cross-bracing rods stand outside the glass walls, so the structure itself is the facade. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
