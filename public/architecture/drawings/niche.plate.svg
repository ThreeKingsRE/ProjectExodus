  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a round-headed recess set into a wall, its half-dome hood carved like a scallop shell, with a projecting sill holding a vase. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
