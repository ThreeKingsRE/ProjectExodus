    .ink { stroke: var(--_ink); fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .solid { fill: var(--_ink); stroke: none; }
    .l-profile { stroke-width: 1.5; }
    .l-cut { stroke-width: 2.2; }
    .l-fine { stroke-width: 0.6; }
