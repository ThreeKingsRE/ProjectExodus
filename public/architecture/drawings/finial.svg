  <title id="t">Finial: elevation</title>
  <desc id="d">Elevation of a Gothic pinnacle: a body with blind tracery and gablets carries a slender spirelet whose edges are studded with curling leaf crockets, ending in a necking band and a cross-shaped fleuron. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
