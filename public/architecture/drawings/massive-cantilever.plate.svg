<svg xmlns="http://www.w3.org/2000/svg" viewBox="42 92 536 452" role="img" aria-labelledby="t d">
  <title id="t">Architectural drawing</title>
  <desc id="d">Section through a deep concrete mass that projects far beyond the wall carrying it, balanced by a length held down inside, with its steel reinforcement along the top where it is pulled in tension. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
