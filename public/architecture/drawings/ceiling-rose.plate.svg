  <title id="t">Architectural drawing</title>
  <desc id="d">One-point perspective down a room with a plaster ceiling rose over a pendant light, so the medallion and fitting can be judged against the room and a 2.1 m door. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
