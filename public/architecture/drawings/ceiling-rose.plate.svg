  <title id="t">Architectural drawing</title>
  <desc id="d">Plan looking up at a round plaster ornament on a ceiling: rings of beads and mouldings around sixteen leaf-shaped petals, with the light fitting hanging from its centre. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
