  <title id="t">Qibla Wall: plan</title>
  <desc id="d">Plan of a mosque prayer hall: the qibla wall facing Mecca with the mihrab niche at its centre and the minbar beside it; the rows of worshippers run parallel to it, so the whole hall is oriented by this one wall. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
