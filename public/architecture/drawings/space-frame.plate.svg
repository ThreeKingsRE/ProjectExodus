  <title id="t">Architectural drawing</title>
  <desc id="d">Plan of a roof structure made of two parallel grids of short steel members, the lower one offset by half a bay and linked to the upper by diagonals into pyramids, meeting at spherical joints. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
