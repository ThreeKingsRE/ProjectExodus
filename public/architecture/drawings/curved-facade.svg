  <title id="t">Curved Façade: plan</title>
  <desc id="d">Plan of a floor whose façade follows an arc: the structural grid, the mullions and the inner wall are all set out on radial lines from a single centre of curvature, so every bay is the same angle and the glass reads as one continuous sweep. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
