  <title id="t">Cornice: section</title>
  <desc id="d">Section through a classical cornice: bed mouldings and a dentil band step out from the frieze to carry the corona, a deep projecting slab whose drip throws rain clear, crowned by an S-curved cymatium. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
