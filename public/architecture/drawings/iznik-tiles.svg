<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Iznik Tiles: elevation</title>
  <desc id="d">Elevation of a four-tile Iznik panel: serrated saz leaves, tulips and carnations are drawn so that each tile carries a quarter of a medallion that completes where four tiles meet, framed by border tiles with cloud bands. Source: After 16th-century Iznik tile panels, e.g. the Rüstem Pasha Mosque, Istanbul. Generic; not a copy of a specific panel. Original drawing by Project Exodus.</desc>
