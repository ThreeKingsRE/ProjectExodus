<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Kubbealtı / Domed Chamber: section</title>
  <desc id="d">Section through a square domed council chamber: thick walls carrying a lead-covered dome on pendentives, a continuous divan bench around the walls, tiled lower walls, and a grilled window high in the wall from which the ruler could follow proceedings unseen. Source: After the Kubbealtı (Imperial Council Hall), Topkapı Palace, Istanbul (16th c.). Simplified; not a survey. Original drawing by Project Exodus.</desc>
