  <title id="t">Baluster: section · close-up in context</title>
  <desc id="d">Section through a straight stair with the row of slender upright spindles between the steps and the handrail highlighted. Source: Riser and going set by Blondel’s rule (2 risers + 1 going ≈ 630 mm), after François Blondel, Cours d’architecture (1675–83). Original drawing by Project Exodus.</desc>
