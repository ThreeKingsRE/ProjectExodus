  <title id="t">Quoins: isometric</title>
  <desc id="d">Isometric of a building corner: large dressed stones are laid up the corner in alternating long and short faces, so that each course bonds into both walls and visibly strengthens the angle against the brickwork. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
