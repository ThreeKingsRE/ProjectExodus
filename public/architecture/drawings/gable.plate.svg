  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a house end where the wall rises into a triangle under the two slopes of the roof, edged by projecting bargeboards. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
