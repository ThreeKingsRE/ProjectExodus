  <title id="t">Chevron Bracing: elevation</title>
  <desc id="d">Elevation of a steel frame with braces rising from each column base to meet at the middle of the beam above, forming an inverted V that resists sideways forces while leaving room for openings. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
