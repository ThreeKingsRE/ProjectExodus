  <title id="t">Rustication: elevation</title>
  <desc id="d">Elevation of four common kinds of rustication: banded (horizontal channels only), chamfered with V-joints, vermiculated with worm-track tooling, and diamond-point faces, with the joint profile of each cut in section at the right. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
