<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Juliet Balcony: section</title>
  <desc id="d">Section through a French door with a Juliet balcony: the doors open inward and a railing is fixed across the outside of the opening at guard height, so the window can stand open safely although there is no platform to step onto. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
