  <title id="t">Heraldic Altarpiece Façade: elevation</title>
  <desc id="d">Elevation of a late-Gothic Spanish frontispiece over a portal, laid out like an altarpiece in tiers of canopied niches with statues around a huge royal coat of arms held by an eagle, between pinnacled buttresses under a cresting. Source: After Spanish retable-façades such as San Pablo and San Gregorio, Valladolid (late 15th c.). Generic; not a survey. Original drawing by Project Exodus.</desc>
