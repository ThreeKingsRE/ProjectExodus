<svg xmlns="http://www.w3.org/2000/svg" viewBox="112 82 496 462" role="img" aria-labelledby="t d">
  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a garden fountain: a jet rising from a small upper bowl, water overflowing into a wider bowl below and then into a broad basin at ground level. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
