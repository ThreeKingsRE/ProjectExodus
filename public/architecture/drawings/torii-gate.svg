  <title id="t">Torii Gate: elevation</title>
  <desc id="d">Elevation of a myōjin-style torii: two slightly inclined pillars on black base sleeves, a tie beam passing through them, and a doubled top lintel whose upper member sweeps upward at the ends, with a name tablet at the centre. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
