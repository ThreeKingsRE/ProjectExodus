  <title id="t">Architectural drawing</title>
  <desc id="d">Plan looking up at a ceiling divided by crossing beams into a grid of square sunken panels, each with stepped mouldings and a carved rosette at its centre. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
