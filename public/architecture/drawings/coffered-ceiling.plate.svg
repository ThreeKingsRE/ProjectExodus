<svg xmlns="http://www.w3.org/2000/svg" viewBox="68 70 464 610" role="img" aria-labelledby="t d">
  <title id="t">Architectural drawing</title>
  <desc id="d">One-point perspective down a room with a coffered ceiling: rows of sunken square panels between crossing ribs, each with a rosette, receding toward the far wall. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
