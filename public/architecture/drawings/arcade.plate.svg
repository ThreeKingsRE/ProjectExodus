  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a covered walkway fronted by a continuous series of round arches springing from square piers, carrying a wall above. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
