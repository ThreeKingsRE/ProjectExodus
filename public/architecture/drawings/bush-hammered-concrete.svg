  <title id="t">Bush-Hammered Concrete: section</title>
  <desc id="d">Section through a ribbed concrete wall before and after bush-hammering: ribs cast against timber inserts are struck with a toothed hammer that breaks their tips into a rough, shadowed texture exposing the aggregate. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
