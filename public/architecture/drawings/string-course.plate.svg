  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a three-storey façade divided by projecting string courses at each floor, with the wall cut in section at the right to show how each course projects and throws water clear with a drip. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
