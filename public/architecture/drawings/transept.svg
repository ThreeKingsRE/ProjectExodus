  <title id="t">Transept: isometric</title>
  <desc id="d">Isometric of a cruciform church: the transept arms cross the long nave at right angles, meeting it at a crossing marked by a tower; the key plan shows the Latin-cross layout this produces. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
