  <title id="t">Machicolation: section</title>
  <desc id="d">Section through the top of a castle wall where the parapet projects out on stone brackets, leaving openings in the floor through which defenders could drop missiles on attackers at the foot of the wall. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
