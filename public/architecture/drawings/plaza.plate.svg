  <title id="t">Architectural drawing</title>
  <desc id="d">Plan of a public square enclosed by building frontages with streets entering at its edges, an arcade along one side, and paving radiating from a central fountain. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
    svg { --_ink: var(--ink, #1f2a37); --_paper: var(--paper, #f4efe3); --_accent: var(--accent, #9a3412); }
