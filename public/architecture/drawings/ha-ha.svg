  <title id="t">Ha-Ha: section</title>
  <desc id="d">Section through the edge of a lawn where a hidden ditch with a vertical wall on the garden side keeps grazing animals out while leaving the view across the landscape unbroken. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
