<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 59.37 464 592.63" role="img" aria-labelledby="t d">
  <title id="t">Architectural drawing</title>
  <desc id="d">Section through a straight stair with the stout posts at the foot and at the landing highlighted, carrying the handrail. Source: Riser and going set by Blondel’s rule (2 risers + 1 going ≈ 630 mm), after François Blondel, Cours d’architecture (1675–83). Original drawing by Project Exodus.</desc>
