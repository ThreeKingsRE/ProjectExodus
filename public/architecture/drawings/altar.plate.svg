  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a church altar raised on three steps: a carved frontal beneath the stone mensa, a gradine shelf carrying candlesticks, a central tabernacle and a crucifix above. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
