<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Brise-Soleil: section</title>
  <desc id="d">Section through a window shaded by a brise-soleil: horizontal fins projecting from the façade are spaced so that high summer sun is intercepted while low winter sun passes beneath them into the room. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
