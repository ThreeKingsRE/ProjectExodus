<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Clerestory: section</title>
  <desc id="d">Cross-section of a basilica: the central nave rises above the lower side aisles, and windows in the upper walls let daylight down into the middle of the building. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
