    <text class="t-small" x="26" y="726">SOURCE: After the gerberettes of the Centre Pompidou, Paris (1977; Piano &amp;</text>
    <text class="t-small" x="26" y="736">Rogers, engineer Peter Rice, Arup), named for Heinrich Gerber. Simplified;</text>
    <text class="t-small" x="26" y="746">not a survey.</text>
