  <title id="t">Double-Height Space: section</title>
  <desc id="d">Section through a room that rises through two storeys: a gallery on the upper floor overlooks the tall void, which is lit by full-height glazing, linking the two levels visually. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
