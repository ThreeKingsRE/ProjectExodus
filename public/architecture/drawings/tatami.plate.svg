  <title id="t">Architectural drawing</title>
  <desc id="d">Plan of a small Japanese room floored with straw mats: four full mats arranged in a pinwheel around a central half mat, with cloth edging on the long sides and an alcove in one wall. Source: Mat size per the Chūkyōma standard (910 × 1820 mm); traditional 4.5-mat layout. Original drawing by Project Exodus.</desc>
