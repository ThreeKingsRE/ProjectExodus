  <title id="t">Stupa: elevation</title>
  <desc id="d">Elevation of a great stupa: a solid hemispherical dome on a drum terrace with a railing, crowned by a square enclosure and a mast of three umbrellas, ringed at ground level by a stone railing entered through carved gateways. Source: After the Great Stupa at Sanchi, India (3rd c. BCE – 1st c. CE). Simplified; not a survey. Original drawing by Project Exodus.</desc>
