<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Rammed Earth: section</title>
  <desc id="d">Section through a wall built by pounding damp earth in shallow layers between temporary boards, with the formwork and tamping shown at the top and a roof overhang to keep rain off. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
