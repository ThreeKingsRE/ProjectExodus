<svg xmlns="http://www.w3.org/2000/svg" viewBox="184 132 392 482" role="img" aria-labelledby="t d">
  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a fitted bookcase spanning a wall: three bays of shelving divided by uprights over a run of cupboards, finished with a cornice at the top and a plinth at the floor. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
