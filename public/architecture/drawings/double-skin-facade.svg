<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Double-Skin Façade: section</title>
  <desc id="d">Section through a double-skin façade over two storeys: an outer single glass skin and an inner insulated skin enclose a ventilated cavity holding solar blinds and maintenance grilles; air enters low, warms, rises and leaves high at each floor. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
