  <title id="t">Roof Garden: section</title>
  <desc id="d">Section through a planted roof showing its layers from the concrete slab up: insulation, waterproofing, a root barrier, a drainage layer, filter fabric and the soil the plants grow in. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
