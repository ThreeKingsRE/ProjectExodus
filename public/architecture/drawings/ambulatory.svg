<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Ambulatory: plan</title>
  <desc id="d">Plan of the east end of a pilgrimage church: the side aisles continue as a curved walkway around the back of the apse, behind its arcade of columns, giving access to a ring of radiating chapels without disturbing the altar. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
