  <title id="t">Spiral Stair: plan</title>
  <desc id="d">Plan of a circular stair whose wedge-shaped steps radiate from a central post, rising almost a full turn to a landing, with the direction of travel marked. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
