  <title id="t">Architectural drawing</title>
  <desc id="d">Section through a thick wall of sun-dried mud bricks on a stone footing, plastered with mud on both faces, with round roof beams passing through near the top. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
