  <title id="t">Metro Entrance: elevation</title>
  <desc id="d">Elevation of an entrance to an underground station: a stair going down through the pavement, edged by a flowing cast-iron balustrade, with plant-like stems rising to a curved sign and lamps shaped like buds. Source: In the manner of Hector Guimard’s Art Nouveau Paris Métro entrances (c. 1900). Generic; not a copy of a specific entrance. Original drawing by Project Exodus.</desc>
