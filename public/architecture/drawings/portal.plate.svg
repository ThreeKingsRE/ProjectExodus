  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a monumental church entrance: a series of arches stepping inward over column shafts frame a pair of doors under a carved semicircular panel. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
