  <title id="t">Mihrab: elevation</title>
  <desc id="d">Elevation of a mihrab set in the qibla wall: a pointed niche with a fluted conch hood on slender colonnettes, enclosed by a rectangular frame bearing an inscription band, with a lamp hanging in the niche. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
