  <title id="t">Log Cabin: elevation</title>
  <desc id="d">Elevation of a wall of stacked round logs with filled gaps between them, the logs of the two walls crossing alternately at the corner where they are notched over each other. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
