  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of an Art Deco doorway whose fanlight is a sunburst: long and short rays alternate around a half-disc sun, above door leaves patterned with stacked chevrons. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
