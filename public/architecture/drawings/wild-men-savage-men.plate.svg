  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a carved hairy man with a leafy wreath and a long beard, a club on his shoulder and a heraldic shield, standing on a corbel, with a round close-up of his head and beard. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
