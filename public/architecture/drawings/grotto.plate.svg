  <title id="t">Architectural drawing</title>
  <desc id="d">Section through a man-made cave set into a mound in a garden: rough rock walls studded with shells, dripping water and a pool, with a sculpture resting inside. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
