  <title id="t">Egg-and-Dart: elevation</title>
  <desc id="d">Elevation of an egg-and-dart band: egg shapes set in open cups alternate with pointed darts along a quarter-round ovolo moulding, here above a bead-and-reel astragal, with the profile shown at the left. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
