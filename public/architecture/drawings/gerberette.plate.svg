  <text class="t-credit" x="128" y="533">SOURCE: After the gerberettes of the Centre Pompidou, Paris (1977; Piano &amp; Rogers, engineer Peter Rice,</text>
  <text class="t-credit" x="128" y="542">Arup), named for Heinrich Gerber. Simplified; not a survey.</text>
