    <circle cx="300" cy="220" r="3" class="solid"/>
    <path d="M400 196L430 250"/>
    <path d="M430 196L460 250"/>
    <path d="M460 196L490 250"/>
    <path d="M490 196L520 250"/>
    <path d="M520 196L550 250"/>
    <path d="M550 196L580 250"/>
    <circle cx="400" cy="216" r="5"/>
  </g>
