  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a garden walkway covered by an open framework: a row of posts carrying beams and closely spaced cross rafters, with climbing plants growing up and over it. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
