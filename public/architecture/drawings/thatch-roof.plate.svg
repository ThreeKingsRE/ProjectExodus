  <title id="t">Architectural drawing</title>
  <desc id="d">Section through a cottage with a thatched roof pitched at about 50 degrees: bundles of reed about 380 mm thick laid in courses over battens and rafters, a rolled reed ridge and overhanging eaves, with a round close-up of the eaves. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
