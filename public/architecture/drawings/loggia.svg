  <title id="t">Loggia: oblique</title>
  <desc id="d">Oblique view of a palazzo whose upper floor is set back behind an open arcade: the loggia is a roofed room open to the outside, its back wall and floor visible through the arches above a balustrade. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
