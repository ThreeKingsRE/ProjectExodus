<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Tower: section</title>
  <desc id="d">Section through a medieval keep: battered walls thickest at the foot, timber floors stacked above a doorless store, an entrance raised to the first floor and reached by a removable stair, arrow slits, and battlements around the wall walk. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
