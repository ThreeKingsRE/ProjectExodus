<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Pratt Truss: elevation</title>
  <desc id="d">Elevation of a bridge-style truss: a top and bottom chord joined by vertical struts and by diagonals that slope down toward the middle, so under load the diagonals pull and the verticals push. Source: Truss form patented by Thomas and Caleb Pratt (1844). Force pattern for gravity load on a simply supported span. Original drawing by Project Exodus.</desc>
