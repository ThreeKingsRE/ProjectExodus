  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a three-arch stone bridge carrying a road over a river, its piers fitted with pointed cutwaters to part the current, edged by a parapet. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
