<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Rose Window: elevation</title>
  <desc id="d">Elevation of a large round Gothic window whose stone tracery radiates from a central hub like the spokes of a wheel, with pointed lights between the spokes and four-lobed roundels around the rim. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
