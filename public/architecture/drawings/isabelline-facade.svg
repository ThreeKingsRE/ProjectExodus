  <title id="t">Isabelline Façade: elevation</title>
  <desc id="d">Elevation of an Isabelline Gothic portal: an ogee arch whose mouldings are studded with stone balls, flanked by slender pinnacles and the yoke-and-arrows emblems of the Catholic Monarchs, within a rectangular frame topped by cresting. Source: After Isabelline Gothic portals such as San Juan de los Reyes, Toledo (1477–1504). Generic; not a survey. Original drawing by Project Exodus.</desc>
