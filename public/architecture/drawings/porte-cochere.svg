  <title id="t">Porte-Cochère: oblique</title>
  <desc id="d">Oblique view of a porte-cochère: a roof on columns projects from the main entrance over the driveway, so that a vehicle can draw up alongside the door and its passengers alight under cover. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
