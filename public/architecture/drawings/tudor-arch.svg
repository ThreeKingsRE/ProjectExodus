  <title id="t">Tudor Arch: elevation</title>
  <desc id="d">Elevation of a low, wide four-centred arch: tight curves at the haunches flattening into long arcs that meet in a shallow point. Source: Original geometric construction drawn by Project Exodus from the standard compass method for this arch form; no external drawing reproduced.</desc>
