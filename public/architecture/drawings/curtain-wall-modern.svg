<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Curtain Wall: section</title>
  <desc id="d">Section through a curtain wall at a floor edge: aluminium mullions and transoms hold double-glazed vision panels and an insulated opaque spandrel; the frame hangs from anchor brackets on the slab, with a fire stop sealing the gap between slab and wall. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
