  <title id="t">Architectural drawing</title>
  <desc id="d">Plan looking up at a square bay divided into four webs by crossing diagonal ribs, with a carved boss where the ribs meet and shafts rising from the piers. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
