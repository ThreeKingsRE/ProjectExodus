  <title id="t">Architectural drawing</title>
  <desc id="d">Plan looking up at a square bay covered by two intersecting barrel vaults, with the diagonal groins where they meet and the stone courses of each web. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
