<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Organic Ornament: elevation</title>
  <desc id="d">Elevation of an ornamental panel built the way Louis Sullivan taught: a simple geometric seed of squares and axes at the centre, from which plant-like growth spreads outward along the diagonals until it fills the frame. Source: After Louis Sullivan, A System of Architectural Ornament (1924). Original drawing by Project Exodus.</desc>
