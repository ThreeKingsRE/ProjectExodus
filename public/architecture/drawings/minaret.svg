  <title id="t">Minaret: elevation</title>
  <desc id="d">Elevation of a slender Ottoman minaret: a square base and transition zone, a polygonal shaft with two balconies carried on muqarnas corbelling, and a tall conical lead cap crowned by a finial. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
