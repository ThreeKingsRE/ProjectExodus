    <path d="M320 270 L266 230 L266 200 L320 200 Z" fill="url(#h-stone)" stroke="none"/>
    <path d="M266 120 L286 120 L286 200 L266 200 Z" fill="url(#h-stone)" stroke="none"/>
    <path d="M320 190 L450 190 L450 202 L320 202 Z" fill="url(#h-timber)" stroke="none"/>
    <path d="M120 500 L520 500 L520 520 L120 520 Z" fill="url(#h-earth)" stroke="none"/>
