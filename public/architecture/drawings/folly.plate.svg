  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a garden ornament built as a ruined tower: a deliberately jagged top, decorative arrow slits, creeping ivy and scattered stones, serving no practical purpose. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
