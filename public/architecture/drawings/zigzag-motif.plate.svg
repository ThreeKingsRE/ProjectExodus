  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a round-headed doorway framed by two orders of chevron moulding, the zigzag carried around the arch and down the jambs, with cushion capitals at the springing. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
