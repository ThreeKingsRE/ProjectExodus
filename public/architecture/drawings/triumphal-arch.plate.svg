  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a free-standing monumental gateway with a tall central arch and two lower side arches, framed by columns and crowned by a high attic carrying an inscription. Source: Three-bay Roman type (cf. the Arch of Constantine, Rome, 315 CE). Generic original drawing by Project Exodus; inscription illustrative, not a survey.</desc>
