  <title id="t">Hip Roof: roof plan</title>
  <desc id="d">Roof plan of a rectangular roof that slopes down on all four sides, the diagonal hips meeting a short central ridge, with arrows showing the direction of fall. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
