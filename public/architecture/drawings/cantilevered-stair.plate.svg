  <title id="t">Architectural drawing</title>
  <desc id="d">Section across a stair whose stone steps are built into a wall at one end and project freely at the other, with the load on the free end resisted where the step is held in the wall. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
