    text { fill: var(--_ink); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9px; letter-spacing: 0.08em; stroke: none; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 0.14em; }
