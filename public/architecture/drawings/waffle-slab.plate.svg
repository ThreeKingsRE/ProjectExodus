  <title id="t">Architectural drawing</title>
  <desc id="d">Plan looking up at a concrete floor slab with a grid of square recesses between crossing ribs, left solid around the columns where loads concentrate. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
