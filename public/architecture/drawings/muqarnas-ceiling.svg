<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Muqarnas Ceiling: reflected ceiling plan</title>
  <desc id="d">Plan looking up at a vault built from many tiers of small faceted niches stepping inward like a honeycomb to an eight-pointed star at the crown. Source: Simplified eight-fold tier scheme in the manner of Islamic muqarnas vaulting. Original drawing by Project Exodus; not a measured survey of a specific building.</desc>
