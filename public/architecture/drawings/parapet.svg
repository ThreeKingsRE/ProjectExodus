  <title id="t">Parapet: section</title>
  <desc id="d">Section through the edge of a flat roof where the outside wall continues above the roof as a low protective wall, with the waterproof membrane turned up against it and a coping on top. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
