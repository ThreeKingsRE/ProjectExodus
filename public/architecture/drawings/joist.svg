  <title id="t">Joist: isometric</title>
  <desc id="d">Isometric of floor framing: closely spaced joists span between two supporting beams, braced against twisting by criss-cross bridging at mid-span, with subfloor boards (shown only on the far half) nailed across their tops. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
