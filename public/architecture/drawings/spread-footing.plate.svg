  <title id="t">Architectural drawing</title>
  <desc id="d">Section through a reinforced concrete column standing on a wide, shallow concrete pad buried in the ground, which spreads the column’s load over enough soil to carry it. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
