  <title id="t">Boiserie: elevation</title>
  <desc id="d">Elevation of a wall lined in carved timber panelling: tall panels with shaped heads and shell carvings above a dado rail, lower dado panels, a cornice at the ceiling and a skirting at the floor. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
