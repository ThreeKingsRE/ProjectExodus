<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Floral Ironwork: elevation</title>
  <desc id="d">Elevation of an Art Nouveau balcony railing: within a frame of posts and rails, forged stems rise from collared roots in whiplash curves, branching into leaves and flower heads, each panel mirrored about its centre. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
