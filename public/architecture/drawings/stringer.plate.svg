  <title id="t">Architectural drawing</title>
  <desc id="d">Section through a straight stair with the sloping side board that supports the ends of the steps highlighted. Source: Riser and going set by Blondel’s rule (2 risers + 1 going ≈ 630 mm), after François Blondel, Cours d’architecture (1675–83). Original drawing by Project Exodus.</desc>
