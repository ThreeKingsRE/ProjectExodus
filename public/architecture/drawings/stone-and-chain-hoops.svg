<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Stone-and-Chain Hoops: section</title>
  <desc id="d">Section through a tall double-shelled pointed dome, with horizontal rings of linked stone beams and iron cramps built into it at several levels, holding it together against the tendency to spread outward. Source: Principle as used in Brunelleschi’s dome of Santa Maria del Fiore, Florence (1420–36). Simplified; not a survey. Original drawing by Project Exodus.</desc>
