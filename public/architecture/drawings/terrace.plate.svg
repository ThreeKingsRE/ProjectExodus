  <title id="t">Architectural drawing</title>
  <desc id="d">Section through a hillside garden shaped into a series of level platforms held up by stone retaining walls, each edged with a balustrade and linked by flights of steps. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
