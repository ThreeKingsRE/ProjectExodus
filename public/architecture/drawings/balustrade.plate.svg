<svg xmlns="http://www.w3.org/2000/svg" viewBox="186 376 398 188" role="img" aria-labelledby="t d">
  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a classical balustrade: vase-shaped balusters stand in runs between solid pedestals on a continuous plinth and bottom rail, capped by a moulded handrail. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
