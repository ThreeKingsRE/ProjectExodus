  <title id="t">Grand Staircase: plan</title>
  <desc id="d">Plan of a ceremonial stair: a single wide central flight rises to a half landing, then splits into two flights that turn back and rise on either side to an upper gallery. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
