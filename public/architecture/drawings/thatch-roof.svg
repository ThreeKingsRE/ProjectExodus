<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Thatch Roof: section</title>
  <desc id="d">Section through the eaves of a steep roof covered with a thick layer of reed laid on battens and rafters, finished with a rolled ridge, its deep overhang throwing rain clear of the wall. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
