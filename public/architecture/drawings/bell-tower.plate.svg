  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a free-standing campanile: a square shaft divided by string courses, its windows growing larger towards the top, a belfry stage with two-light openings showing the bells, and a pyramidal roof with a cross. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
