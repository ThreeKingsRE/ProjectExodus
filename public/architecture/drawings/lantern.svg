  <title id="t">Lantern: elevation</title>
  <desc id="d">Elevation of a small glazed turret with arched windows and a little dome, sitting on the crown of a larger dome to let light down into the space below. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
