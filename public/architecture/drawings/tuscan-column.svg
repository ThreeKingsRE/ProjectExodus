<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Tuscan Order: half section · half elevation</title>
  <desc id="d">Half section and half elevation of a plain, unfluted column with a simple moulded base and capital, carrying a plain entablature. Source: Proportions after Giacomo Barozzi da Vignola, Regola delli cinque ordini d’architettura (Rome, 1562). Simplified; drawn by Project Exodus.</desc>
