  <title id="t">Architectural drawing</title>
  <desc id="d">Plan of an octagonal baptistery: thick eight-sided walls with niches in the diagonal faces, a ring of columns carrying the dome, and a sunken octagonal font reached by steps at the centre. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
