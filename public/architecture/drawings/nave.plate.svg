  <title id="t">Architectural drawing</title>
  <desc id="d">Cross-section through a basilican church: a tall central nave between two arcades, a low aisle on each side under a sloping roof, high clerestory windows above the arcade, and an open timber roof, with a round close-up of the junction of arcade, clerestory and aisle roof. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
