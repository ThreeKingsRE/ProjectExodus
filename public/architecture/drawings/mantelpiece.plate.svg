<svg xmlns="http://www.w3.org/2000/svg" viewBox="222 148 316 475" role="img" aria-labelledby="t d">
  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a classical chimneypiece: pilaster jambs with scroll consoles either side of the fire opening, a frieze with a central tablet, a projecting shelf, and an overmantel mirror above. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
