<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Acanthus: elevation</title>
  <desc id="d">Elevation of a single stylised acanthus leaf as carved on a Corinthian capital: a central midrib, deeply cut lobes each ending in a pointed finger with a rib running to its tip, and the tip rolled forward. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
