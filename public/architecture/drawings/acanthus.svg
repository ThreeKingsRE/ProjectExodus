  <title id="t">Acanthus: elevation</title>
  <desc id="d">Elevation of a single stylised acanthus leaf as carved on a Corinthian capital: a central midrib, deeply cut lobes each ending in serrated fingers, shadow-holes between the lobes, and a tip curling forward. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
