  <title id="t">Pediment: elevation</title>
  <desc id="d">Elevation of a classical pediment: raking cornices rise from the horizontal cornice of the entablature to enclose the triangular tympanum, with acroteria at the apex and corners; segmental and broken variants are shown below. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
