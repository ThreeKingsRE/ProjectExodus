<svg xmlns="http://www.w3.org/2000/svg" viewBox="112 62 466 522" role="img" aria-labelledby="t d">
  <title id="t">Architectural drawing</title>
  <desc id="d">Elevation of a tall building that steps inward in stages as it rises, keeping inside an imaginary sloping plane drawn from the far side of the street so daylight reaches the pavement. Source: Setback rules of the New York 1916 Zoning Resolution. Generic original drawing by Project Exodus; not a specific building.</desc>
  <style>
    svg { --_ink: var(--ink, #1f2a37); --_paper: var(--paper, #f4efe3); --_accent: var(--accent, #9a3412); }
