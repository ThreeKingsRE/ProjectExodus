  <title id="t">Architectural drawing</title>
  <desc id="d">Plan of a room with a recess set into one wall under an arch, large enough to hold a built-in bed or seat. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
  <style>
