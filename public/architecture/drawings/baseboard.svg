  <title id="t">Baseboard: interior elevation</title>
  <desc id="d">Elevation of a room wall with the moulded board running along the bottom where the wall meets the floor highlighted. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
