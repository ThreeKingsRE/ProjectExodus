  <title id="t">Ridgepole: section · close-up in context</title>
  <desc id="d">Section through a timber cottage roof: pairs of rafters leaning together at 40 degrees from the wall plates, a collar tie across them, and a round ridgepole laid in the notch where they meet at the peak, with a round close-up of that ridge joint. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
