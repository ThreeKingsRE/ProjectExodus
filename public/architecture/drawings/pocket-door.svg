<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Pocket Door: plan</title>
  <desc id="d">Plan through a wall where the door, instead of swinging, slides sideways into a hollow inside the wall itself, leaving the opening clear. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
