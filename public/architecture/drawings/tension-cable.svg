<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" role="img" aria-labelledby="t d">
  <title id="t">Tension Cable: section</title>
  <desc id="d">Section through a long roof suspended from a tall mast by straight steel cables, balanced by a cable anchored into the ground behind, so the cables work in tension and the mast in compression. Source: Original drawing by Project Exodus from the standard geometric construction of this form; no external drawing reproduced.</desc>
