name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Build-time placeholder. DATABASE_URL is intentionally unset so the build
      # uses the Prisma build-time fallback (lib/db/prisma.ts).
      AUTH_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Architecture summaries up to date
        run: npm run arch:summaries -- --check

      - name: Architecture drawings up to date
        run: npm run arch:drawings -- --check

      - name: Type check
        run: npx tsc --noEmit

      - name: Type check drawing scripts
        run: npx tsc -p scripts/architecture/tsconfig.json

      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npx next build
